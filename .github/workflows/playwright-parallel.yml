name: Playwright Parallel Test

on:
  workflow_dispatch:

jobs:
  playwright-parallel:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm

      - name: Abhängigkeiten der Anwendung installieren
        run: npm ci

      - name: Anwendung bauen
        run: npm run build

      - name: Playwright-Abhängigkeiten installieren
        working-directory: test-automation/playwright
        run: npm ci

      - name: Versionen dokumentieren
        run: |
          node --version
          npm --version
          google-chrome --version
          cd test-automation/playwright
          npx playwright --version

      - name: Anwendung starten und Playwright-Tests parallel ausführen
        shell: bash
        run: |
          npm start > app-ci.log 2>&1 &
          APP_PID=$!

          echo "Warte auf http://localhost:3000 ..."

          for i in {1..60}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Anwendung ist erreichbar."
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000 > /dev/null

          cd test-automation/playwright

          set +e
          npx playwright test \
            e2e/material-einkaufsliste.spec.js \
            e2e/rezepte.spec.js \
            --shard=${{ matrix.shardIndex }}/2 \
            --workers=1 \
            --reporter=line

          TEST_EXIT=$?
          set -e

          cd ../..
          kill $APP_PID || true

          exit $TEST_EXIT

      - name: Playwright-Artefakte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-parallel-${{ matrix.shardIndex }}
          path: |
            test-automation/playwright/test-results
            app-ci.log
          if-no-files-found: ignore